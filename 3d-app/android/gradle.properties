org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
# Compile Kotlin inside the Gradle daemon instead of a second JVM (saves RAM on 8 GB machines).
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Don't keep a 2 GB daemon alive after builds on this 8 GB machine.
org.gradle.daemon=false
# Kotlin incremental caches break when Gradle's cache and the project are on different drives.
kotlin.incremental=false
